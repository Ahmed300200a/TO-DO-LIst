<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO-LIST</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="form-overlay">
    <header>
       <div class="container">
        <div class="container-header">
        <h1>TO-DO-LIST</h1>
        <i class="fa-solid fa-list-check"></i>
        </div>
        <p>Organize your day, prioritize your goals, and get things done step  by step</p>
       </div>
    </header>
    <div class="main-section">
        <div class="container">
            <div class="header-part">
                <div class ="container-details">
                <button>Add New Task</button>
                
                    <ul>
                        <li class="active all">All</li>
                        <li>Active</li>
                        <li class="filterDone">done</li>
                    </ul>
                </div>
                <ul id="listOfDays">
                    <li data-day="Friday">Fri</li>
                    <li data-day="Saturday">Sat</li>
                    <li data-day="Sunday">Sun</li>
                    <li data-day="Monday">Mon</li>
                    <li data-day="Tuesday">Tus</li>
                    <li data-day="Wednesday">Wen</li>
                    <li data-day="Thursday">Thr</li>
                </ul> 
            </div>
             <div class="tasksArea">

             </div>
        </div>
       
    </div>
    </div>
</div>
    <div class="formTask" id="formTask">
        <h1>Add New Task</h1>
        <form id="form">
            <div class="title">
                <label for="title">Enter the title of the task</label>
                <input id="title" type="text" required>
            </div>
            <div class="description">
                <label for="">Enter the description of the task</label>
                <textarea></textarea>
            </div>
            <select>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
            </select>
            <div class="level">
                <label for="">Select the level of the task</label>
                <div class="level-container">
                    <div class="level-item">
                        <input type="radio" name="level" id="low" value="low">
                        <label for="low">Low</label>
                    </div>
                    <div class="level-item">
                        <input type="radio" name="level" id="medium" value="medium">
                        <label for="medium">Medium</label>
                    </div>
                    <div class="level-item">
                        <input type="radio" name="level" id="high" value="high">
                        <label for="high">High</label>
                    </div>
                </div>
            </div>
            <div class="buttons">
                <button id="submit">Submit</button>
                <button id="Cancel">Cancel</button>
            </div>
        </form>
    </div>
  <script src="script.js"></script>  
</body>
</html>
